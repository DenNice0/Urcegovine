<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Банк</title>  
    <link rel="stylesheet" href="../css/style_page.css">
    <script src="../java/script.js"></script>
    
  
    
</head>
<body> 

  <div id="goBack"><a href="../index.html"><h1>На главную</h1></a></div>


  <div class="news">
    <div class="news_title"><h2>Банк</h2></div>
    <div class="news_content">
       <h2>Введи число</h2>
           <div class="put">
              <textarea id="number" placeholder="Пароль" class="in"></textarea>
            </div>

        <button onclick="checkNumber()" class="but4">Войти</button> 
        <script>
          function checkNumber() {
          const input = document.getElementById("number");
          const number = input.value.trim();

          if (number === "347777") {
            window.location.href = "../bank/Den.html";
          } else if (number === "123456") {
            window.location.href = "../bank/Art.html";
          } else if (number === "639462") {
            window.location.href = "../bank/Dan.html";
          } else {
            alert("Неверное число!");
          }
          }
        </script>
    </div>
  </div>
</body>
</html>
